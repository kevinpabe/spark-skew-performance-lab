# Perfil ilustrativo; ajustar por plano físico e métricas do job.
# Heartbeat 60s foi relatado. Timeout 600s é proposta, não valor histórico confirmado.
spark.executor.heartbeatInterval 60s
spark.network.timeout 600s
spark.sql.adaptive.enabled true
spark.sql.adaptive.skewJoin.enabled true
spark.sql.adaptive.skewJoin.skewedPartitionFactor 3
spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes 268435456
spark.sql.adaptive.advisoryPartitionSizeInBytes 67108864
# Não definir broadcast global de centenas de MB sem medir memória e cardinalidade.
